<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WalkCal — Food Rewards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%); 
            -webkit-tap-highlight-color: transparent;
        }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="min-h-screen text-slate-800 antialiased selection:bg-emerald-500 selection:text-white pb-12">

    <!-- Mobile-First Navigation Bar -->
    <header class="w-full border-b border-slate-200/80 bg-white/90 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-3.5 sm:px-6 h-14 sm:h-16 flex items-center justify-between">
            <div class="flex items-center gap-3 sm:gap-6">
                <a href="index.html" class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-white shadow-md shadow-emerald-500/20 font-black text-sm">
                        W
                    </div>
                    <span class="text-base sm:text-lg font-black tracking-tight text-slate-900">Walk<span class="text-emerald-600">Cal</span></span>
                </a>

                <!-- Desktop Navigation Tabs -->
                <nav class="hidden md:flex items-center gap-1 bg-slate-100 p-1 rounded-2xl border border-slate-200 text-xs font-bold">
                    <a href="index.html" class="px-3 py-1.5 rounded-xl text-slate-500 hover:text-slate-900 transition-colors">🚶 Calculator</a>
                    <a href="food.html" class="px-3 py-1.5 rounded-xl bg-white text-slate-900 shadow-xs">🍔 Food Rewards</a>
                    <a href="projections.html" class="px-3 py-1.5 rounded-xl text-slate-500 hover:text-slate-900 transition-colors">📈 Projections</a>
                </nav>
            </div>

            <!-- Integrated Weight + Pool Header Pill -->
            <div class="flex items-center bg-slate-100 px-2 sm:px-2.5 py-1 rounded-2xl border border-slate-200 text-xs font-bold gap-1.5 sm:gap-2">
                <div class="flex items-center gap-1">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Weight:</span>
                    <input type="number" id="userWeightInput" step="0.5" value="71" oninput="onWeightChanged(this.value)"
                        class="w-11 bg-white text-center font-bold text-slate-900 text-xs py-0.5 rounded-lg border border-slate-200 outline-none focus:border-emerald-500">
                    <span class="text-[10px] font-semibold text-slate-400">kg</span>
                </div>
                <span class="text-slate-300">|</span>
                <div class="flex items-center gap-1">
                    <span class="text-slate-400">Pool:</span>
                    <span id="headerBurnPool" class="text-emerald-700 font-black">160</span>
                    <span class="text-slate-400 font-semibold text-[10px]">kcal</span>
                </div>
            </div>
        </div>

        <!-- Mobile Navigation Row -->
        <div class="md:hidden flex border-t border-slate-100 px-3 py-1.5 bg-slate-50 justify-around text-xs font-bold">
            <a href="index.html" class="text-slate-500">🚶 Calculator</a>
            <a href="food.html" class="text-emerald-600 font-extrabold">🍔 Food Rewards</a>
            <a href="projections.html" class="text-slate-500">📈 Projections</a>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="max-w-xl mx-auto px-3.5 sm:px-6 pt-3.5 sm:pt-6 space-y-3.5">

        <!-- Compact Walk Deficit Header Strip -->
        <section class="bg-white rounded-2xl p-3 sm:p-4 border border-slate-200/80 shadow-xs flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-sm font-black">
                    ⚡
                </div>
                <div>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block leading-none mb-0.5">Burn Pool</span>
                    <p class="text-sm sm:text-base font-extrabold text-slate-900">
                        <span id="bannerKcal">160</span> <span class="text-xs font-bold text-emerald-600">net kcal</span>
                    </p>
                </div>
            </div>
            <a href="index.html" class="text-xs font-bold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 px-2.5 py-1.5 rounded-xl transition-colors">
                Edit Walk ✏️
            </a>
        </section>

        <!-- Compact Treat Offset Chain Card -->
        <section class="bg-white rounded-3xl p-4 sm:p-6 border border-slate-200/80 shadow-sm shadow-slate-200/40 space-y-3.5">
            <div class="flex items-center justify-between pb-1">
                <div>
                    <h2 class="text-sm sm:text-base font-bold text-slate-900">Treat Offset Chain</h2>
                    <p class="text-[11px] text-slate-400">Bars fill sequentially with your burn pool</p>
                </div>
                <span class="text-[10px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md uppercase tracking-wider">
                    Sequential
                </span>
            </div>

            <!-- Dynamic Sequential List -->
            <div id="foodChainContainer" class="space-y-2.5"></div>

            <!-- Bottom Action Row -->
            <div class="pt-2 flex items-center justify-between gap-2 border-t border-slate-100">
                <button type="button" onclick="addChainItem()" 
                    class="inline-flex items-center gap-1.5 bg-emerald-50 hover:bg-emerald-100 active:scale-[0.98] text-emerald-700 font-bold text-xs px-3.5 py-2 rounded-xl transition-all cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5v14"/></svg>
                    <span>Add Item</span>
                </button>

                <div id="surplusStatusText" class="text-[11px] font-semibold text-slate-400 text-right"></div>
            </div>
        </section>

    </main>

    <script>
        const FOOD_DATABASE = {
            rusk: { name: 'Crispy Rusk', icon: '🍞', cal: 41 },
            jeera_cookie: { name: 'Jeera Cookie', icon: '🍪', cal: 73 },
            roti: { name: 'Whole Wheat Roti', icon: '🫓', cal: 120 },
            chai: { name: 'Indian Masala Chai', icon: '☕', cal: 120 },
            coffee_dd: { name: 'Double-Double Coffee', icon: '☕', cal: 140 },
            gulab_jamun: { name: 'Gulab Jamun', icon: '🍯', cal: 150 },
            cookie: { name: 'Choc Chip Cookie', icon: '🍪', cal: 160 },
            pizza: { name: 'Pizza Slice', icon: '🍕', cal: 260 },
            samosa: { name: 'Aloo Samosa', icon: '🥟', cal: 280 },
            cake: { name: 'Cake Slice', icon: '🍰', cal: 320 },
            fries: { name: "McDonald's Med Fries", icon: '🍟', cal: 350 },
            jr_chicken: { name: "McDonald's Jr Chicken", icon: '🍔', cal: 380 }
        };

        let currentWeightKg = parseFloat(localStorage.getItem('user_weight_kg')) || 71;
        let activeNetKcal = parseFloat(localStorage.getItem('walkcal_net_cal')) || 160;
        let userChainKeys = JSON.parse(localStorage.getItem('user_food_chain')) || ['jeera_cookie', 'rusk'];

        function onWeightChanged(val) {
            currentWeightKg = parseFloat(val) || 70;
            localStorage.setItem('user_weight_kg', currentWeightKg);
        }

        function setChainItem(slotIndex, foodKey) {
            userChainKeys[slotIndex] = foodKey;
            localStorage.setItem('user_food_chain', JSON.stringify(userChainKeys));
            renderFoodChain();
        }

        function addChainItem() {
            const keys = Object.keys(FOOD_DATABASE);
            userChainKeys.push(keys[userChainKeys.length % keys.length]);
            localStorage.setItem('user_food_chain', JSON.stringify(userChainKeys));
            renderFoodChain();
        }

        function removeChainItem(slotIndex) {
            if (userChainKeys.length <= 1) return;
            userChainKeys.splice(slotIndex, 1);
            localStorage.setItem('user_food_chain', JSON.stringify(userChainKeys));
            renderFoodChain();
        }

        function renderFoodChain() {
            document.getElementById('headerBurnPool').textContent = Math.round(activeNetKcal);
            document.getElementById('bannerKcal').textContent = Math.round(activeNetKcal);
            document.getElementById('userWeightInput').value = currentWeightKg;

            const container = document.getElementById('foodChainContainer');
            const surplusEl = document.getElementById('surplusStatusText');
            let remainingCalories = activeNetKcal;
            let html = '';

            for (let i = 0; i < userChainKeys.length; i++) {
                const currentKey = userChainKeys[i];
                const food = FOOD_DATABASE[currentKey] || FOOD_DATABASE.jeera_cookie;
                
                const needed = food.cal;
                const covered = Math.min(remainingCalories, needed);
                const pct = Math.min(100, Math.round((covered / needed) * 100));
                const isEarned = covered >= needed;
                const isZero = covered === 0;
                
                remainingCalories = Math.max(0, remainingCalories - covered);

                const optionsHtml = Object.keys(FOOD_DATABASE).map(k => {
                    const f = FOOD_DATABASE[k];
                    return `<option value="${k}" ${k === currentKey ? 'selected' : ''}>${f.icon} ${f.name} (${f.cal} kcal)</option>`;
                }).join('');

                html += `
                    <div class="p-3 sm:p-3.5 rounded-2xl border transition-all space-y-2 
                        ${isEarned 
                            ? 'bg-emerald-50/40 border-emerald-200' 
                            : isZero 
                                ? 'bg-slate-50/50 border-slate-200/60 opacity-75' 
                                : 'bg-slate-50 border-slate-200/90 shadow-2xs'}">
                        
                        <div class="flex items-center justify-between gap-1.5">
                            <div class="flex items-center gap-1.5 min-w-0 flex-1">
                                <span class="w-4 h-4 rounded-full text-[9px] font-black flex items-center justify-center shrink-0 
                                    ${isEarned ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-600'}">
                                    ${isEarned ? '✓' : (i + 1)}
                                </span>
                                
                                <select onchange="setChainItem(${i}, this.value)" 
                                    class="bg-white hover:bg-slate-100 text-slate-900 font-bold text-xs rounded-xl border border-slate-200 px-2 py-1 outline-none focus:border-emerald-500 cursor-pointer truncate max-w-[170px] sm:max-w-xs">
                                    ${optionsHtml}
                                </select>
                            </div>

                            <div class="flex items-center gap-2 shrink-0">
                                <div class="text-right">
                                    <span class="text-xs font-black ${isEarned ? 'text-emerald-700' : 'text-slate-800'}">
                                        ${Math.round(covered)}/${needed}
                                    </span>
                                    <span class="text-[10px] font-bold ${isEarned ? 'text-emerald-600' : 'text-slate-400'} ml-0.5">
                                        (${pct}%)
                                    </span>
                                </div>
                                ${userChainKeys.length > 1 ? `
                                    <button type="button" onclick="removeChainItem(${i})" 
                                        class="text-slate-300 hover:text-rose-500 font-bold text-base px-1 leading-none transition-colors cursor-pointer" title="Remove">&times;</button>
                                ` : ''}
                            </div>
                        </div>

                        <div class="w-full bg-slate-200/70 h-2 rounded-full overflow-hidden">
                            <div class="h-full rounded-full transition-all duration-300 ${isEarned ? 'bg-emerald-500' : 'bg-emerald-400'}" style="width: ${pct}%"></div>
                        </div>

                        <div class="flex justify-between items-center text-[10px] font-semibold pt-0.5">
                            ${isEarned 
                                ? `<span class="text-emerald-600 font-bold">🎉 Earned! Covered by your walk.</span>` 
                                : isZero
                                    ? `<span class="text-slate-400">Needs next session burn pool.</span>`
                                    : `<span class="text-slate-500">Need <strong class="text-slate-800">${needed - Math.round(covered)} kcal</strong> more to finish.</span>`
                            }
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;

            if (remainingCalories > 0) {
                surplusEl.innerHTML = `<span class="text-emerald-600 font-bold">+${Math.round(remainingCalories)} kcal unallocated</span>`;
            } else {
                surplusEl.innerHTML = `<span>All calories allocated</span>`;
            }
        }

        document.addEventListener('DOMContentLoaded', renderFoodChain);
    </script>
</body>
</html>
