<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WalkCal — Food Rewards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%); }
    </style>
</head>
<body class="min-h-screen text-slate-800 antialiased selection:bg-emerald-500 selection:text-white pb-16">

    <!-- Shared Navigation Bar -->
    <header class="w-full border-b border-slate-200/80 bg-white/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-6">
                <a href="index.html" class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-white shadow-md shadow-emerald-500/20 font-black">
                        W
                    </div>
                    <span class="text-lg font-black tracking-tight text-slate-900">Walk<span class="text-emerald-600">Cal</span></span>
                </a>

                <nav class="hidden md:flex items-center gap-1 bg-slate-100 p-1 rounded-2xl border border-slate-200 text-xs font-bold">
                    <a href="index.html" class="px-3 py-1.5 rounded-xl text-slate-500 hover:text-slate-900 transition-colors">🚶 Calculator</a>
                    <a href="food.html" class="px-3 py-1.5 rounded-xl bg-white text-slate-900 shadow-xs">🍔 Food Rewards</a>
                    <a href="projections.html" class="px-3 py-1.5 rounded-xl text-slate-500 hover:text-slate-900 transition-colors">📈 Projections</a>
                </nav>
            </div>

            <div class="flex items-center gap-2 text-xs font-bold bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200">
                <span class="text-slate-400">Burn Pool:</span>
                <span id="headerBurnPool" class="text-emerald-700 font-black text-sm">160</span>
                <span class="text-slate-400 font-normal">net kcal</span>
            </div>
        </div>

        <div class="md:hidden flex border-t border-slate-100 px-4 py-2 bg-slate-50 justify-around text-xs font-bold">
            <a href="index.html" class="text-slate-500">🚶 Calculator</a>
            <a href="food.html" class="text-emerald-600">🍔 Food Rewards</a>
            <a href="projections.html" class="text-slate-500">📈 Projections</a>
        </div>
    </header>

    <!-- Food Rewards Workspace -->
    <main class="max-w-3xl mx-auto px-4 sm:px-6 pt-8 space-y-6">

        <!-- Top Walk Summary Card -->
        <section class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200/80 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
                <span class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-0.5">Active Walk Session</span>
                <div class="flex items-baseline gap-2">
                    <span id="bannerKcal" class="text-3xl font-black text-slate-900">160</span>
                    <span class="text-emerald-600 font-bold text-sm">net active calories burned</span>
                </div>
            </div>
            <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-2 rounded-xl transition-colors">
                <span>Adjust Walk Parameters</span>
                <span>&rarr;</span>
            </a>
        </section>

        <!-- Progressive Treat Offset Chain -->
        <section class="bg-white rounded-3xl p-6 sm:p-7 border border-slate-200/80 shadow-sm shadow-slate-200/40 space-y-5">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-base font-bold text-slate-900">Interactive Treat Offset Chain</h2>
                    <p class="text-xs text-slate-400 mt-0.5">Add items and fill progress bars sequentially</p>
                </div>
                <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-xl">
                    Live Chain
                </span>
            </div>

            <!-- List of Items -->
            <div id="foodChainContainer" class="space-y-3.5"></div>

            <!-- Action Controls -->
            <div class="pt-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-t border-slate-100">
                <button type="button" onclick="addChainItem()" 
                    class="inline-flex items-center justify-center gap-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold text-xs px-4 py-3 rounded-2xl transition-all cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    <span>+ Add Another Food Item</span>
                </button>

                <div id="surplusStatusText" class="text-xs font-semibold text-slate-400 sm:text-right"></div>
            </div>
        </section>

    </main>

    <script>
        const FOOD_DATABASE = {
            coffee_dd: { name: 'Double-Double Coffee', icon: '☕', cal: 140 },
            roti: { name: 'Plain Whole Wheat Roti', icon: '🫓', cal: 120 },
            chai: { name: 'Indian Masala Chai', icon: '☕', cal: 120 },
            gulab_jamun: { name: 'Gulab Jamun', icon: '🍯', cal: 150 },
            cookie: { name: 'Chocolate Chip Cookie', icon: '🍪', cal: 160 },
            pizza: { name: 'Pizza Slice', icon: '🍕', cal: 260 },
            samosa: { name: 'Aloo Samosa', icon: '🥟', cal: 280 },
            cake: { name: 'Cake Slice', icon: '🍰', cal: 320 },
            fries: { name: "McDonald's Med Fries", icon: '🍟', cal: 350 },
            jr_chicken: { name: "McDonald's Jr Chicken", icon: '🍔', cal: 380 }
        };

        let activeNetKcal = parseFloat(localStorage.getItem('walkcal_net_cal')) || 160;
        let userChainKeys = JSON.parse(localStorage.getItem('user_food_chain')) || ['coffee_dd'];

        function setChainItem(slotIndex, foodKey) {
            userChainKeys[slotIndex] = foodKey;
            localStorage.setItem('user_food_chain', JSON.stringify(userChainKeys));
            renderFoodChain();
        }

        function addChainItem() {
            const keys = Object.keys(FOOD_DATABASE);
            userChainKeys.push(keys[userChainKeys.length % keys.length]);
            localStorage.setItem('user_food_chain', JSON.stringify(userChainKeys));
            renderFoodChain();
        }

        function removeChainItem(slotIndex) {
            if (userChainKeys.length <= 1) return;
            userChainKeys.splice(slotIndex, 1);
            localStorage.setItem('user_food_chain', JSON.stringify(userChainKeys));
            renderFoodChain();
        }

        function renderFoodChain() {
            document.getElementById('headerBurnPool').textContent = Math.round(activeNetKcal);
            document.getElementById('bannerKcal').textContent = Math.round(activeNetKcal);

            const container = document.getElementById('foodChainContainer');
            const surplusEl = document.getElementById('surplusStatusText');
            let remainingCalories = activeNetKcal;
            let html = '';

            for (let i = 0; i < userChainKeys.length; i++) {
                const food = FOOD_DATABASE[userChainKeys[i]] || FOOD_DATABASE.coffee_dd;
                const needed = food.cal;
                const covered = Math.min(remainingCalories, needed);
                const pct = Math.min(100, Math.round((covered / needed) * 100));
                const isEarned = covered >= needed;
                remainingCalories = Math.max(0, remainingCalories - covered);

                const optionsHtml = Object.keys(FOOD_DATABASE).map(k => {
                    const f = FOOD_DATABASE[k];
                    return `<option value="${k}" ${k === userChainKeys[i] ? 'selected' : ''}>${f.icon} ${f.name} (${f.cal} kcal)</option>`;
                }).join('');

                html += `
                    <div class="bg-slate-50 p-4 rounded-2xl border ${isEarned ? 'border-emerald-200 bg-emerald-50/20' : 'border-slate-200/80'} transition-all space-y-3">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                            <div class="flex items-center gap-2">
                                <span class="w-5 h-5 rounded-full ${isEarned ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-600'} text-[10px] font-bold flex items-center justify-center shrink-0">
                                    ${isEarned ? '✓' : (i + 1)}
                                </span>
                                <span class="text-xs font-bold text-slate-800">Item #${i + 1}:</span>
                                <select onchange="setChainItem(${i}, this.value)" 
                                    class="bg-white hover:bg-slate-100 text-slate-900 font-bold text-xs rounded-xl border border-slate-200 px-2.5 py-1 outline-none focus:border-emerald-500 cursor-pointer">
                                    ${optionsHtml}
                                </select>
                            </div>
                            <div class="flex items-center justify-between sm:justify-end gap-2.5">
                                <div class="text-right">
                                    <span class="text-xs font-black ${isEarned ? 'text-emerald-700' : 'text-slate-700'}">${Math.round(covered)} / ${needed} kcal</span>
                                    <span class="text-[10px] font-bold ${isEarned ? 'text-emerald-600' : 'text-slate-400'} ml-1">(${pct}%)</span>
                                </div>
                                ${userChainKeys.length > 1 ? `
                                    <button type="button" onclick="removeChainItem(${i})" class="text-slate-300 hover:text-rose-500 font-bold text-base px-1">&times;</button>
                                ` : ''}
                            </div>
                        </div>

                        <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                            <div class="h-full rounded-full transition-all duration-300 ${isEarned ? 'bg-emerald-500' : 'bg-emerald-400'}" style="width: ${pct}%"></div>
                        </div>

                        <div class="flex justify-between items-center text-[11px] font-semibold">
                            ${isEarned 
                                ? `<span class="text-emerald-600 font-bold">🎉 Fully Earned! Covered by your walk.</span>` 
                                : `<span class="text-slate-400">Need <strong class="text-slate-700">${needed - Math.round(covered)} more kcal</strong> to complete.</span>`
                            }
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
            if (remainingCalories > 0) {
                surplusEl.innerHTML = `<span class="text-emerald-600 font-bold">🎉 +${Math.round(remainingCalories)} kcal surplus burn available!</span>`;
            } else {
                surplusEl.innerHTML = `<span>All calories accounted for</span>`;
            }
        }

        document.addEventListener('DOMContentLoaded', renderFoodChain);
    </script>
</body>
</html>
